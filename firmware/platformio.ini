; SmartRide on-board unit firmware
; Default target is the ESP32-S3 (the board specified in the Phase 1 report).
;   Build:          pio run
;   Flash + monitor pio run -t upload -t monitor
;   Classic ESP32:  pio run -e esp32dev

[platformio]
default_envs = esp32-s3

[env]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
test_framework = unity
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D BUILD_EPOCH=$UNIX_TIME
    -D FW_VERSION=\"0.1.0\"
    -D CORE_DEBUG_LEVEL=1
    -D UNITY_INCLUDE_DOUBLE
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB octal PSRAM), native USB-Serial/JTAG
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SMARTRIDE_BOARD=\"ESP32-S3\"

; Classic ESP32-WROOM-32 DevKit (USB-UART bridge)
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D SMARTRIDE_BOARD=\"ESP32\"
